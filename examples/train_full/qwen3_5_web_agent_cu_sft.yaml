### model
model_name_or_path: /home/qid/esyoon/workspace/models/Qwen3.5-9B
image_max_pixels: 1003520   # 14*14*4*1280, matches smart_resize default max_pixels in preprocess
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
# Run scripts/web_agent_cu/preprocess.py (both splits) before launching this config.
# Re-run preprocess whenever you change image_history_n / action_split_mode / action_mapping_mode.
dataset: web_agent_cu_train
eval_dataset: web_agent_cu_val
template: qwen3_5
cutoff_len: 32768
mask_history: false     # keep loss on ALL assistant turns of a trajectory
preprocessing_num_workers: 60
dataloader_num_workers: 4

### output
output_dir: saves/qwen3_5-9b/web_agent_cu/full_sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb
overwrite_cache: true   

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 1.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 500
