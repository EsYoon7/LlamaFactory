### model
model_name_or_path: /home/qid/esyoon/workspace/models/Qwen3.5-9B
image_max_pixels: 262144   # matches smart_resize default max_pixels in preprocess
video_max_pixels: 16384
trust_remote_code: true
deepspeed: examples/deepspeed/ds_z2_config.json
flash_attn: sdpa               
# packing: false
# neat_packing: false                                                                                                           
gradient_checkpointing: true  
enable_liger_kernel: true    

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
# Run scripts/web_agent_cu/preprocess.py (both splits) before launching this config.
dataset: web_agent_cu_train
eval_dataset: web_agent_cu_val
template: qwen3_5
cutoff_len: 32768
mask_history: false
preprocessing_num_workers: 60
dataloader_num_workers: 4
overwrite_cache: true


### output
output_dir: saves/qwen3_5-9b/web_agent_cu/lora_sft
logging_steps: 2 
save_steps: 50
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
prediction_loss_only: true
eval_accumulation_steps: 1
eval_steps: 8
